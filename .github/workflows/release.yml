#
# MzDebirth - Created by Simon Moscrop
#
# Build every release's downloads on GitHub and attach them to it, so a release never goes
# out without its installer.
#
# Triggered by pushing a version tag (git push origin v0.2.0), or by creating a release with
# a new tag on GitHub, which pushes the tag. If the release already exists the files are
# added to it; if not, a draft is made with the notes in docs/releases/<tag>.md, to read over
# and publish.
#
# The rack plays the synths' own engines, compiled from their repositories, so those are
# checked out beside this one, as on a desk - each at its default branch.
#
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to rebuild the downloads for, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # The JUCE the app is built and tested against. Move it on deliberately, not by accident.
  JUCE_TAG: "9.0.2"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: JUCE, the synths and the PCF, beside the repository
        run: |
          git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE ../JUCE
          foreach ($synth in "Mz101", "Mz303", "Mz808", "Mz909", "Mz950", "MzPCF") {
              git clone --depth 1 "https://github.com/simozzer/$synth" "../$synth"
              if ($LASTEXITCODE -ne 0) { throw "could not clone $synth" }
          }

      # Mz950's sample disks are not in its repository - *.hfe is ignored there - but made
      # by its disk generator, as its own release makes them. The check plays the drum disk,
      # and the installer ships all twelve.
      - name: Mz950's disks
        run: |
          ../Mz950/AkaiS950Synth/build.ps1 -To ../Mz950/disks
          if (-not (Test-Path ../Mz950/disks/DRUMS.hfe)) { throw "the disk generator wrote no DRUMS.hfe" }

      - name: The tag matches the version in CMakeLists.txt
        run: |
          if ((Get-Content CMakeLists.txt -Raw) -notmatch "project\(MzDebirth VERSION ([0-9.]+)") { throw "no version in CMakeLists.txt" }
          if ("v$($Matches[1])" -ne $env:TAG) { throw "tag $env:TAG but CMakeLists.txt says $($Matches[1]) - bump the version before tagging" }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build, check and package
        run: ./build.ps1 -Release

      #
      # The release for the tag is found by listing them all, drafts too: looked up by its tag,
      # GitHub does not return a draft, so a release drafted on the website before the tag was
      # pushed went unseen, and a second draft was made beside it with the files on - leaving
      # the one that was then published with none. A published release is preferred over a
      # draft. Files already there of the same name are replaced.
      #
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "win64-Setup.exe", "win64.zip" | ForEach-Object { "dist/MzDebirth-$env:VERSION-$_" }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"

          # Into a variable first: piped straight on, Invoke-RestMethod hands the whole list down
          # as one object, and the filter lets every release through.
          $all = Invoke-RestMethod "$api/releases?per_page=100" -Headers $headers
          $release = $all | Where-Object { $_.tag_name -eq $env:TAG } |
                     Sort-Object { $_.draft } | Select-Object -First 1

          if (-not $release) {
              $notes = "docs/releases/$env:TAG.md"
              if (Test-Path $notes) { $from = @("--notes-file", $notes) } else { $from = @("--generate-notes") }
              gh release create $env:TAG @files --draft --title "MzDebirth $env:VERSION" @from
              if ($LASTEXITCODE -ne 0) { throw "could not make a release for $env:TAG" }
              exit 0
          }

          Write-Host "attaching to release $($release.id): $($release.name)$(if ($release.draft) { ' (draft)' })"
          foreach ($file in $files) {
              $name = Split-Path $file -Leaf
              foreach ($old in $release.assets | Where-Object { $_.name -eq $name }) {
                  Invoke-RestMethod -Method Delete "$api/releases/assets/$($old.id)" -Headers $headers
              }
              Invoke-RestMethod -Method Post -Headers $headers -ContentType "application/octet-stream" -InFile $file `
                  -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?name=$name" | Out-Null
              Write-Host "  $name"
          }

  #
  # The Mac zip, a beta, attached to the same release once the Windows job above has made it.
  # The build itself is mac.yml, which also runs on every push to main as a check.
  #
  mac:
    needs: windows
    uses: ./.github/workflows/mac.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  #
  # The Linux archive, a beta, attached likewise. The build is linux.yml, a check on every
  # push to main too.
  #
  linux:
    needs: windows
    uses: ./.github/workflows/linux.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
